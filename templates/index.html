<!DOCTYPE html>
<html>

<head>

    <title>AI Resume Analyzer</title>

    <style>

        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container {

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);

            text-align: center;

            width: 400px;
        }

        h1 {
            color: #333;
        }

        input[type="file"] {

            margin: 20px 0;
        }

        button {

            background-color: #007bff;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }

        button:hover {

            background-color: #0056b3;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Resume Analyzer</h1>

        <p>Upload your resume and get ATS analysis</p>



        <form action="/upload" method="POST" enctype="multipart/form-data">

            <input type="file" name="resume" accept=".pdf">

            <br><br>
                    <textarea 
            name="job_description"
            placeholder="Paste Job Description Here..."
            rows="8"
            style="width:100%; padding:15px; border-radius:10px; margin-top:20px;">
        </textarea>

        <br><br>
            <button type="submit">Analyze Resume</button>

        </form>

    </div>

</body>

</html>
